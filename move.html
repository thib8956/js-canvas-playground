<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #status-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            margin-left: 1rem;
            color: #ffffff;
        }

        .canvas-wrapper {
            width: 90vw;
            height: 90vh;
            border-radius: 16px;
            background-color: #1e293b;
        }

        #canvas {
          display: block;
          width: 100%;
          height: 100%;
        }

    </style>
</head>
<body>
    <div id="status-line"></div>
    <div class="canvas-wrapper">
        <canvas id="canvas" tabindex="0"></canvas>
    </div>
    <script type="module" src="./move.js"></script>
</body>
</html>
